name: Update data

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch Google data
        run: node --no-warnings scripts/fetch-google-data.ts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ADSENSE_ACCOUNT: ${{ secrets.ADSENSE_ACCOUNT }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "chore: update data" && git push; }

  # Pushes made with GITHUB_TOKEN don't trigger deploy.yml, so call it directly
  deploy:
    needs: fetch
    uses: ./.github/workflows/deploy.yml
